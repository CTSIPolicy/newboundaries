      return '<button type="button" data-k="'+esc(c[0])+'" aria-pressed="'+(focusCat===c[0])+'"><i style="background:'+c[2]+'"></i>'+esc(c[1])+' <em>'+counts[c[0]]+'</em></button>'; }).join('');
    $('tsm-legnote').textContent = M().note || '';
    $('tsm-legnote').style.display = M().note ? '' : 'none';
  }
  function setView(v, keepSel){
    view = v; mode = VIEWS[v].order[0]; focusCat = null; hovered = null;
    if(!keepSel && selected && !visible(byKey[selected])) selected = null;
    drawViews(); drawModes(); drawLegend(); paint(); showPanel(); drawTable();
  }
  $('tsm-views').addEventListener('click', function(e){ var b=e.target.closest('button'); if(b) setView(b.getAttribute('data-v')); });
  $('tsm-modes').addEventListener('click', function(e){ var b=e.target.closest('button'); if(!b) return;
    mode=b.getAttribute('data-m'); focusCat=null; drawModes(); drawLegend(); paint(); });
  $('tsm-leg').addEventListener('click', function(e){ var b=e.target.closest('button'); if(!b) return;
    var k=b.getAttribute('data-k'); focusCat = focusCat===k ? null : k; drawLegend(); paint(); });

  // ------------------------------------------------------------------- panel --
  function pill(d, v, m){ var c=catOf(d,v,m), col=c[2], md=VIEWS[v].modes[m];
    if(md.tint && soft(d)) col=tint(col,.5);
    return '<span class="tsm-pill"><i style="background:'+col+'"></i>'+esc(c[1])+'</span>'; }
  function polLine(c){ return '<span class="tsm-pill"><i style="background:'+(function(){var col=catOf(c,'today','pol')[2]; return soft(c)?tint(col,.5):col;})()+'"></i>'+esc(c.pol)+'</span>'; }
  function tsLine(c){ return '<span class="tsm-pill"><i style="background:'+catOf(c,'today','model')[2]+'"></i>'+esc(c.mt)+'</span>'+
    (c.p.length ? '<br><span style="color:var(--muted)">'+c.p.map(esc).join('; ')+'</span>' : ''); }
  // The boundary map supplied for each area: shown as an image where it is one.
  function mapSource(u){ return /lgbce/.test(u) ? 'Local Government Boundary Commission for England' : 'House of Commons Library'; }
  function mapBlock(u, label){
    if(!u) return '';
    if(/\.(png|jpe?g|gif|webp)(\?|$)/i.test(u))
      return '<a href="'+esc(u)+'" target="_blank" rel="noopener"><img class="tsm-mapimg" src="'+esc(u)+'" alt="'+esc(label)+'" loading="lazy" onerror="this.style.display=\'none\'"></a>'+
        '<a href="'+esc(u)+'" target="_blank" rel="noopener">Open full-size map</a> <span style="color:var(--muted)">('+mapSource(u)+')</span>';
    return '<a href="'+esc(u)+'" target="_blank" rel="noopener">Open boundary map (PDF)</a> <span style="color:var(--muted)">('+mapSource(u)+')</span>';
  }
  function chip(key, cls){ var d=byKey[key]; return '<button type="button" class="tsm-chip '+(cls||'')+'" data-go="'+esc(key)+'">'+esc(shortName(d.n))+'</button>'; }
  function showPanel(){
    var shown = hovered || selected, d = shown && byKey[shown], el=$('tsm-panel');
    if(!d){
      el.innerHTML = '<div class="tsm-empty"><h3>Explore the map</h3><p>Hover over any area to see its details here. Click (or tap) to keep them in place, or search by name.</p><p>Switch between <b>today\'s councils</b> and the map <b>after reorganisation</b> using the buttons above. Areas affected by the same decision are outlined together.</p></div>';
      return;
    }
    var h = (shown===selected ? '<button type="button" class="tsm-close" aria-label="Clear selection">×</button>' : '');
    if(d.kind==='cur'){
      h += '<h3>'+esc(d.n)+'</h3><p class="tsm-sub">'+esc(d.t)+'</p><dl>'+
        '<dt>Reorganisation</dt><dd>'+pill(d,'today','lgr')+'<br>'+esc(d.lt)+'</dd>';
      if(d.b.length){
        h += '<dt>Becomes part of</dt><dd><div class="tsm-chips">'+d.b.map(function(k){ return chip('F:'+k,'fut'); }).join('')+'</div></dd>';
        var maps = []; d.b.forEach(function(k){ var u=futOf(k).map; if(u && maps.indexOf(u)<0) maps.push(u); });
        if(maps.length) h += '<dt>Proposed boundaries</dt><dd>'+maps.map(function(u){ return mapBlock(u,'Map of the proposed authorities replacing '+shortName(d.n)); }).join('<br>')+'</dd>';
      }
      h += '<dt>Political control</dt><dd>'+polLine(d)+'</dd>'+
           '<dt>Trading Standards today</dt><dd>'+tsLine(d)+'</dd></dl>';
    } else {
      h += '<h3>'+esc(d.n)+'</h3><p class="tsm-sub">'+pill(d,'future','outcome')+'</p>'+
        '<div class="tsm-figs"><div><b>'+num(d.pop)+'</b>population (mid-2024)</div><div><b>'+num(d.area)+'</b>area, km²</div>'+
        '<div><b>'+(d.pop&&d.area?num(d.pop/d.area):'–')+'</b>people per km²</div></div><dl>'+
        (d.map ? '<dt>Boundary map</dt><dd>'+mapBlock(d.map,'Map of the proposed authorities including '+shortName(d.n))+'</dd>' : '')+
        '<dt>What changes</dt><dd>'+esc(d.dt)+'</dd>'+
        '<dt>Made up of</dt><dd>'+esc(d.pre)+'</dd>'+
        '<dt>Today\'s councils in this area</dt><dd>'+d.cur.map(function(code){ var c=curOf(code);
          return '<span class="tsm-mini"><button type="button" data-go="'+code+'">'+esc(c.n)+'</button><br>'+
            '<span style="color:var(--muted)">Political control:</span> '+polLine(c)+'<br>'+
            '<span style="color:var(--muted)">Trading Standards:</span> '+tsLine(c)+'</span>'; }).join('')+'</dd>';
      h += '</dl>';
    }
    el.innerHTML = h;
  }
  // open an item, switching map if it isn't on the current one
  function go(key){ var d=byKey[key]; if(!d) return;
    if(!visible(d)) { selected = key; setView(d.kind==='fut' ? 'future' : 'today', true); }
    select(key); }
  $('tsm-panel').addEventListener('click', function(e){
    if(e.target.closest('.tsm-close')) return select(null);
    var b=e.target.closest('[data-go]'); if(b) go(b.getAttribute('data-go'));
  });
  function select(key){ selected = key; paint(); showPanel(); }

  // ----------------------------------------------------------- map pointer --
  // Hovering shows an area in the panel on the right; clicking pins it there.
  svg.addEventListener('mousemove', function(e){
    var k = e.target.__key || null;
    if(k!==hovered){ hovered=k; paint(); showPanel(); }
  });
  svg.addEventListener('mouseleave', function(){ if(hovered){ hovered=null; paint(); showPanel(); } });
  svg.addEventListener('click', function(e){ var k=e.target.__key; select(k && k!==selected ? k : null); });

  // ------------------------------------------------------------------ search --
  var ALL = CUR.concat(FUT), q=$('tsm-q'), ql=$('tsm-qlist'), hits=[], hi=-1;
  function closeList(){ ql.hidden=true; q.setAttribute('aria-expanded','false'); hi=-1; }
  function renderList(){
    ql.innerHTML = hits.map(function(d,i){ return '<li role="option" id="tsm-o'+i+'" data-go="'+esc(d.key)+'" aria-selected="'+(i===hi)+'">'+esc(d.n)+
      '<small>'+(d.kind==='fut' ? 'after reorganisation' : 'today')+'</small></li>'; }).join('');
    ql.hidden = !hits.length; q.setAttribute('aria-expanded', String(!!hits.length));
    if(hi>=0) q.setAttribute('aria-activedescendant','tsm-o'+hi); else q.removeAttribute('aria-activedescendant');
  }
  q.addEventListener('input', function(){
    var s=q.value.trim().toLowerCase(); hi=-1;
    hits = s.length<2 ? [] : ALL.filter(function(d){ return d.n.toLowerCase().indexOf(s)>=0 || (d.k||'').toLowerCase().indexOf(s)>=0; }).slice(0,14);
    renderList();
  });
  q.addEventListener('keydown', function(e){
    if(ql.hidden) return;
    if(e.key==='ArrowDown'){ hi=Math.min(hi+1,hits.length-1); renderList(); e.preventDefault(); }
    else if(e.key==='ArrowUp'){ hi=Math.max(hi-1,0); renderList(); e.preventDefault(); }
    else if(e.key==='Enter'){ var d=hits[hi>=0?hi:0]; if(d){ pick(d.key); e.preventDefault(); } }
    else if(e.key==='Escape'){ closeList(); }
  });
  ql.addEventListener('mousedown', function(e){ var li=e.target.closest('li'); if(li){ e.preventDefault(); pick(li.getAttribute('data-go')); } });
  q.addEventListener('blur', function(){ setTimeout(closeList,100); });
  function pick(key){ q.value=byKey[key].n; closeList(); go(key);
    if(window.innerWidth<=600) $('tsm-panel').scrollIntoView({behavior:'smooth',block:'nearest'}); }

  // ------------------------------------------------------------------- table --
  var TCOLS = {
    today:[['n','Council'],['t','Type'],['lg','Reorganisation'],['b','Becomes part of'],['pol','Political control'],['mt','Trading Standards model']],
    future:[['n','Authority'],['st','Outcome'],['pop','Population'],['area','Area (km²)'],['cur','Replaces or draws on'],['map','Boundary map']]
  };
  var sortKey='n', sortDir=1;
  function cell(d,k){
    if(k==='lg') return catOf(d,'today','lgr')[1];
    if(k==='st') return catOf(d,'future','outcome')[1];
    if(k==='b') return d.b.map(function(x){ return shortName(futOf(x).n); }).join('; ');
    if(k==='cur') return d.cur.map(function(c){ return shortName(curOf(c).n); }).join('; ');
    return d[k]; }
  function drawTable(){
    var cols=TCOLS[view], rows=(view==='today'?CUR:FUT).slice();
    if(!cols.some(function(c){return c[0]===sortKey;})) { sortKey='n'; sortDir=1; }
    rows.sort(function(a,b){ var x=cell(a,sortKey), y=cell(b,sortKey);
      if(typeof x!=='number'){ x=String(x==null?'':x); y=String(y==null?'':y); }
      return (x<y?-1:x>y?1:0)*sortDir || (a.n<b.n?-1:1); });
    $('tsm-tsum').textContent = view==='today' ? "Show today's councils as a table" : 'Show the new authorities as a table';
    $('tsm-table').innerHTML = '<thead><tr>'+cols.map(function(c){
      var s = c[0]===sortKey ? (sortDir>0?'ascending':'descending') : 'none';
      return '<th scope="col" aria-sort="'+s+'"><button type="button" data-k="'+c[0]+'">'+c[1]+(c[0]===sortKey?(sortDir>0?' ▲':' ▼'):'')+'</button></th>'; }).join('')+'</tr></thead><tbody>'+
      rows.map(function(d){ return '<tr><td><button type="button" data-go="'+esc(d.key)+'">'+esc(d.n)+'</button></td>'+
        cols.slice(1).map(function(c){ if(c[0]==='map') return '<td>'+(d.map?'<a href="'+esc(d.map)+'" target="_blank" rel="noopener">'+(/\.pdf/i.test(d.map)?'Map (PDF)':'Map')+'</a>':'')+'</td>';
          var v=cell(d,c[0]); return '<td>'+esc(typeof v==='number'?num(v):v)+'</td>'; }).join('')+'</tr>'; }).join('')+'</tbody>';
  }
  $('tsm-table').addEventListener('click', function(e){
    var b=e.target.closest('button'); if(!b) return;
    if(b.hasAttribute('data-k')){ var k=b.getAttribute('data-k'); sortDir = k===sortKey ? -sortDir : 1; sortKey=k; drawTable(); return; }
    go(b.getAttribute('data-go'));
    $('tsm-svg').scrollIntoView({behavior:'smooth',block:'center'});
  });

  setView('today');
})();
</script>

</body>
</html>
